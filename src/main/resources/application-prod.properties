# Production DB URL (replace with your prod DB server)
spring.datasource.url=jdbc:postgresql://192.168.1.236:5432/tododb
spring.datasource.username=family
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Use 'validate' or none here for safety (no schema auto-update in prod)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
